name: Release

# Tag-triggered: push a `v0.1.0`-style tag (matching the version in
# package.json) and this workflow builds, tests, and publishes
# `@aortl/next-cache` to npm.
#
# Auth: OIDC trusted publishing — no NPM_TOKEN secret required.
# Configure the trusted publisher on the npm package page:
#   Settings → Trusted Publishers → Add → GitHub Actions
#     Repository owner:  Digital-Udvikling
#     Repository:        next-cache
#     Workflow filename: release.yml
#     Environment:       (leave empty unless you set up a GitHub Environment)
#
# Cutting a release:
#   bump `package.json` version → commit → `git tag v<version> && git push --tags`

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC handshake with npm
  attestations: write # build provenance attestations published alongside the package

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tag matches package.json version
        if: github.event_name == 'push'
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match package.json version v$PKG"
            exit 1
          fi
          echo "Releasing v$PKG"

      - name: Typecheck
        run: pnpm -F @aortl/next-cache typecheck

      - name: Unit tests
        run: pnpm -F @aortl/next-cache test:unit

      - name: Integration tests
        run: pnpm -F @aortl/next-cache test:integration

      - name: Build
        run: pnpm -F @aortl/next-cache build

      # Use `npm publish` rather than `pnpm publish` because npm CLI 11.5+ has
      # first-class support for OIDC trusted publishing and provenance, and the
      # root package IS @aortl/next-cache, so a plain `npm publish` from the
      # repo root publishes exactly the right package.
      - name: Publish to npm
        run: npm publish --access public --provenance
